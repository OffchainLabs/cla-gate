name: Sync members

# Writes keyed hashes of the OffchainLabs member list to the CLA_MEMBERS organization variable,
# which the CLA gate reads. The app key lives only in the cla-gate-sync environment, which deploys only from
# main, so gated repositories never have access to it.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-members

jobs:
  sync:
    name: Sync members
    runs-on: ubuntu-latest
    environment: cla-gate-sync
    steps:
      # No permission inputs: the token gets the app's full set, which is only Members: read and
      # Variables: write. The action has no input for the variables permission. The app has no
      # repository permissions, so access to all repositories grants nothing.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # zizmor: ignore[github-app] # v3.3.0
        with:
          client-id: ${{ vars.CLA_GATE_CLIENT_ID }}
          private-key: ${{ secrets.CLA_GATE_PRIVATE_KEY }}
          owner: OffchainLabs  # zizmor: ignore[github-app]

      - name: Write CLA_MEMBERS
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLA_MEMBERS_KEY: ${{ secrets.CLA_MEMBERS_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$CLA_MEMBERS_KEY" ]]; then
            echo "::error::CLA_MEMBERS_KEY is unset; see the setup steps in README.md."
            exit 1
          fi

          # GitHub only promises to withhold secrets, not variables, from fork pull requests, so
          # the variable holds keyed hashes rather than logins. Must match hash_login in
          # cla-gate.yml.
          hash_login() {
            printf '%s' "${1,,}" | openssl dgst -sha256 -hmac "$CLA_MEMBERS_KEY" -r | cut -d' ' -f1
          }

          members=$(gh api --paginate orgs/OffchainLabs/members --jq '.[].login' | sort -u)
          if [[ -z "$members" ]]; then
            echo "::error::The member list came back empty; leaving CLA_MEMBERS unchanged."
            exit 1
          fi
          # Commas at both ends of the list let the gate match ",hash," exactly. The loop runs in
          # this shell rather than in $(...), so set -e stops the sync if any hash fails.
          hash_list=","
          while read -r login; do
            hash_list+="$(hash_login "$login"),"
          done <<< "$members"
          if [[ ! "$hash_list" =~ ^(,[0-9a-f]{64})+,$ ]]; then
            echo "::error::Hashing the member list failed; leaving CLA_MEMBERS unchanged."
            exit 1
          fi
          # The timestamp lets the gate reject a list the sync stopped updating.
          value="$(date -u +%Y-%m-%dT%H:%M:%SZ)|$hash_list"

          if gh api orgs/OffchainLabs/actions/variables/CLA_MEMBERS --silent 2>/dev/null; then
            gh api -X PATCH orgs/OffchainLabs/actions/variables/CLA_MEMBERS --silent \
              -f value="$value" -f visibility=all
          else
            gh api -X POST orgs/OffchainLabs/actions/variables --silent \
              -f name=CLA_MEMBERS -f value="$value" -f visibility=all
          fi
          echo "Wrote $(wc -l <<< "$members") members to CLA_MEMBERS."
