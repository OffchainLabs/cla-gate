name: CLA gate

# Run in other repositories by an organization ruleset (see README.md), which runs it only on pull
# requests into the branches it targets. Marks `license/cla` as passing for pull requests written
# entirely by OffchainLabs members, so internal work isn't blocked when CLA assistant stalls.
# Every other pull request is left for CLA assistant to decide.
on:
  pull_request:

permissions: {}

concurrency:
  group: cla-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cla-gate:
    name: CLA gate
    # Pull requests from forks fall back to CLA assistant. Only people with write access can open
    # pull requests from branches in the repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: read
      statuses: write
    steps:
      # A broken gate must not decide a pull request, so failures are reported on the run without
      # failing the job, and CLA assistant decides. Dependabot runs get no Actions secrets, so
      # the key step fails for them; the last step passes bots without a token.
      #
      # The app key lives in AWS Secrets Manager. The role trusts only this workflow on this
      # repository's main branch, so other workflows in gated repositories can't read it.
      # Gated repositories can have public logs, and AWS's output names the account, role and
      # secret, so none of it is printed: on failure the step prints only its own message. The
      # role ARN is a secret so it's masked if anything does print it.
      - name: Read the app key
        id: key
        continue-on-error: true
        env:
          ROLE_ARN: ${{ secrets.CLA_GATE_AWS_ROLE_ARN }}
          AWS_DEFAULT_REGION: us-east-2
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*"
            exit 1
          }

          if [[ -z "$ROLE_ARN" ]]; then
            fail "CLA_GATE_AWS_ROLE_ARN isn't set; see the setup steps in OffchainLabs/cla-gate."
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            fail "This run can't get a GitHub OIDC token; the job needs id-token: write."
          fi

          if ! oidc_token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" 2>/dev/null |
            jq -r '.value // empty'); then
            fail "Couldn't get a GitHub OIDC token."
          fi
          if [[ -z "$oidc_token" ]]; then
            fail "Couldn't get a GitHub OIDC token."
          fi
          echo "::add-mask::$oidc_token"

          if ! creds=$(aws sts assume-role-with-web-identity --no-sign-request \
            --role-arn "$ROLE_ARN" --role-session-name cla-gate \
            --web-identity-token "$oidc_token" --duration-seconds 900 \
            --query Credentials --output json 2>/dev/null); then
            fail "Couldn't assume the AWS role. The security team can find the cause in the" \
              "account's CloudTrail logs."
          fi
          AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<< "$creds")
          AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<< "$creds")
          AWS_SESSION_TOKEN=$(jq -r .SessionToken <<< "$creds")
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

          if ! key=$(aws secretsmanager get-secret-value --secret-id cla-gate-app-key \
            --query SecretString --output text 2>/dev/null); then
            fail "Couldn't read the app key from AWS Secrets Manager. The security team can find" \
              "the cause in the account's CloudTrail logs."
          fi
          # A key pasted with Windows line endings would carry a carriage return into each mask.
          key=${key//$'\r'/}
          # An unset or binary secret comes back empty or as "None"; don't pass that on. Accept
          # PKCS#1 ("BEGIN RSA PRIVATE KEY") and PKCS#8 ("BEGIN PRIVATE KEY") headers.
          if [[ "$key" != "-----BEGIN "*"PRIVATE KEY-----"* ]]; then
            fail "The app key in AWS Secrets Manager isn't a PEM private key. Store the GitHub" \
              "App's private key there as plain text."
          fi
          # Mask every line, since the masker matches single lines of a multi-line value.
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              echo "::add-mask::$line"
            fi
          done <<< "$key"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "private-key<<$delimiter"
            echo "$key"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create org membership token
        id: app-token
        if: steps.key.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.CLA_GATE_CLIENT_ID }}
          private-key: ${{ steps.key.outputs.private-key }}
          owner: OffchainLabs
          permission-members: read

      - name: Pass license/cla if every author is an org member
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MEMBERS_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Exits the run on any answer other than member (204) or not a member (404). --globoff
          # stops curl reading the brackets in logins like renovate[bot] as a URL pattern.
          is_member() {
            local code
            code=$(curl -sS --globoff -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $MEMBERS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/OffchainLabs/members/$1")
            case "$code" in
              204) return 0 ;;
              404) return 1 ;;
              *)
                echo "::error::Membership check for $1 returned HTTP $code; expected 204 or 404." \
                  "Check that the CLA gate app has Members: read on OffchainLabs."
                exit 1
                ;;
            esac
          }

          commit_count=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .commits)
          if (( commit_count > 250 )); then
            echo "$commit_count commits exceeds the API listing limit; leaving to CLA assistant."
            exit 0
          fi

          # A commit whose author email isn't linked to a GitHub account has a null login.
          authors=$({
            echo "$PR_AUTHOR"
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
              --jq '.[] | .author.login // "<unlinked>"'
          } | sort -u)

          humans=$(grep -vxE 'dependabot\[bot\]|github-actions\[bot\]' <<< "$authors" || true)
          if [[ -n "$humans" ]]; then
            if [[ -z "$MEMBERS_TOKEN" ]]; then
              echo "::error::No membership token; see the errors from the earlier steps. If the" \
                "role, key, or client ID is missing, follow the setup steps in" \
                "OffchainLabs/cla-gate."
              exit 1
            fi
            while read -r login; do
              if [[ "$login" == "<unlinked>" ]]; then
                echo "A commit author's email isn't linked to a GitHub account; leaving to" \
                  "CLA assistant."
                exit 0
              fi
              if ! is_member "$login"; then
                echo "$login is not an org member; leaving license/cla to CLA assistant."
                exit 0
              fi
            done <<< "$humans"
          fi

          # The commits listed are those of the pull request's head when fetched, which may be
          # newer than HEAD_SHA. Only mark HEAD_SHA if it is still the head.
          head_now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ "$head_now" != "$HEAD_SHA" ]]; then
            echo "Head moved to $head_now while checking; leaving to the run for the new head."
            exit 0
          fi

          gh api "repos/$REPO/statuses/$HEAD_SHA" --silent \
            -f state=success \
            -f context=license/cla \
            -f description="All authors are OffchainLabs members (CLA gate)" \
            -f target_url="$RUN_URL"
          echo "Marked license/cla as passing for $HEAD_SHA."
