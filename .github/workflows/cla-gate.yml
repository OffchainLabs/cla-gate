name: CLA gate

# Run in other repositories by an organization ruleset (see README.md). Marks `license/cla` as
# passing for pull requests written entirely by OffchainLabs members, so internal work isn't
# blocked when CLA assistant stalls. Every other pull request is left for CLA assistant to decide.
on:
  pull_request:

permissions: {}

concurrency:
  group: cla-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cla-gate:
    name: CLA gate
    # Pull requests from forks fall back to CLA assistant. Only people with write access can open
    # pull requests from branches in the repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      # A broken gate must never block merges, so failures are reported on the run without
      # failing the job. CLA assistant still decides the pull request.
      - name: Pass license/cla if every author is an org member
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Written hourly by sync-members.yml, as ",login1,login2,...,".
          MEMBERS: ${{ vars.CLA_MEMBERS }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "$MEMBERS" ]]; then
            echo "::error::CLA_MEMBERS is empty or unset. Check the Sync members workflow in" \
              "OffchainLabs/cla-gate."
            exit 1
          fi

          is_member() {
            case "$1" in
              dependabot\[bot\] | github-actions\[bot\]) return 0 ;;
            esac
            [[ "$MEMBERS" == *",$1,"* ]]
          }

          if ! is_member "$PR_AUTHOR"; then
            echo "$PR_AUTHOR is not an org member; leaving license/cla to CLA assistant."
            exit 0
          fi

          commit_count=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .commits)
          if (( commit_count > 250 )); then
            echo "$commit_count commits exceeds the API listing limit; leaving to CLA assistant."
            exit 0
          fi

          # A commit whose author email isn't linked to a GitHub account has a null login.
          authors=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | .author.login // "<unlinked>"' | sort -u)
          while read -r author; do
            if [[ "$author" == "<unlinked>" ]] || ! is_member "$author"; then
              echo "Commit author $author is not an org member; leaving to CLA assistant."
              exit 0
            fi
          done <<< "$authors"

          gh api "repos/$REPO/statuses/$HEAD_SHA" --silent \
            -f state=success \
            -f context=license/cla \
            -f description="All authors are OffchainLabs members (CLA gate)" \
            -f target_url="$RUN_URL"
          echo "Marked license/cla as passing for $HEAD_SHA."
