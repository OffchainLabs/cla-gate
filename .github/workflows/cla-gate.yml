name: CLA gate

# Run in other repositories by an organization ruleset (see README.md). Marks `license/cla` as
# passing for pull requests written entirely by OffchainLabs members, so internal work isn't
# blocked when CLA assistant stalls. Every other pull request is left for CLA assistant to decide.
on:
  pull_request:

permissions: {}

concurrency:
  group: cla-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cla-gate:
    name: CLA gate
    # Pull requests from forks fall back to CLA assistant. Only people with write access can open
    # pull requests from branches in the repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      # A broken gate must never block merges, so failures are reported on the run without
      # failing the job. CLA assistant still decides the pull request.
      - name: Pass license/cla if every author is an org member
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Written hourly by sync-members.yml, as "<UTC timestamp>|,hash1,hash2,...,", where
          # each hash is an HMAC of a lowercased member login keyed with CLA_MEMBERS_KEY.
          CLA_MEMBERS: ${{ vars.CLA_MEMBERS }}
          CLA_MEMBERS_KEY: ${{ secrets.CLA_MEMBERS_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Earlier successes are recognised by this exact text, so changing it stops the gate
          # from withdrawing successes posted before the change.
          pass_description="All authors are OffchainLabs members (CLA gate)"

          # A success this gate posted on HEAD_SHA earlier, for instance in another pull request
          # with a different base, no longer holds once the gate can't pass it here.
          withdraw_own_success() {
            latest=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/status?per_page=100" --jq \
              '.statuses[] | select(.context == "license/cla") | "\(.state) \(.description)"')
            if [[ "$latest" == "success $pass_description" ]]; then
              gh api "repos/$REPO/statuses/$HEAD_SHA" --silent \
                -f state=pending \
                -f context=license/cla \
                -f description="Not all authors are members (CLA gate). Details to recheck." \
                -f target_url="https://cla-assistant.io/check/$REPO?pullRequest=$PR_NUMBER"
              echo "Withdrew the gate's earlier success on $HEAD_SHA."
            fi
          }

          decline() {
            echo "$1; leaving license/cla to CLA assistant."
            withdraw_own_success
            exit 0
          }

          fail() {
            echo "::error::$*"
            withdraw_own_success
            exit 1
          }

          # Unexpected failures, such as an API error, also mean the gate can't pass HEAD_SHA.
          trap withdraw_own_success ERR

          # Must match hash_login in sync-members.yml.
          hash_login() {
            printf '%s' "${1,,}" | openssl dgst -sha256 -hmac "$CLA_MEMBERS_KEY" -r | cut -d' ' -f1
          }

          commit_count=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .commits)
          if (( commit_count > 250 )); then
            decline "$commit_count commits exceeds the API listing limit"
          fi

          # A commit whose author email isn't linked to a GitHub account has a null login.
          authors=$({
            echo "$PR_AUTHOR"
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
              --jq '.[] | .author.login // "<unlinked>"'
          } | sort -u)

          # Bots pass without the member list, so Dependabot runs, which get no Actions secrets,
          # don't need CLA_MEMBERS_KEY.
          humans=$(grep -vxE 'dependabot\[bot\]|github-actions\[bot\]' <<< "$authors" || true)
          if [[ -n "$humans" ]]; then
            if [[ -z "$CLA_MEMBERS" || -z "$CLA_MEMBERS_KEY" ]]; then
              fail "CLA_MEMBERS or CLA_MEMBERS_KEY is empty or unset. See the setup steps in" \
                "OffchainLabs/cla-gate."
            fi

            # A stale list could still contain people who have left the organization.
            synced_at=${CLA_MEMBERS%%|*}
            members=${CLA_MEMBERS#*|}
            # `date -d` also accepts "" and words like "now", so check the exact format first.
            timestamp_format='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
            if [[ ! "$synced_at" =~ $timestamp_format ]] \
              || ! synced_epoch=$(date -u -d "$synced_at" +%s 2>/dev/null); then
              fail "CLA_MEMBERS has no valid sync timestamp. Run the Sync members workflow in" \
                "OffchainLabs/cla-gate."
            fi
            age=$(( $(date -u +%s) - synced_epoch ))
            if (( age > 24 * 3600 || age < -300 )); then
              fail "CLA_MEMBERS was last synced at $synced_at, which is stale or in the future." \
                "Re-enable or fix the Sync members workflow in OffchainLabs/cla-gate."
            fi

            # Only full hashes, so an empty hash from a failed sync or lookup can't match.
            members_format='^(,[0-9a-f]{64})+,$'
            if [[ ! "$members" =~ $members_format ]]; then
              fail "CLA_MEMBERS has a malformed member list. Run the Sync members workflow in" \
                "OffchainLabs/cla-gate."
            fi

            while read -r login; do
              if [[ "$login" == "<unlinked>" ]]; then
                decline "A commit author's email isn't linked to a GitHub account"
              fi
              login_hash=$(hash_login "$login")
              if [[ "$members" != *",$login_hash,"* ]]; then
                decline "$login is not an org member"
              fi
            done <<< "$humans"
          fi

          # The commits listed are those of the pull request's head when fetched, which may be
          # newer than HEAD_SHA. Only mark HEAD_SHA if it is still the head.
          head_now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [[ "$head_now" != "$HEAD_SHA" ]]; then
            echo "Head moved to $head_now while checking; leaving to the run for the new head."
            exit 0
          fi

          gh api "repos/$REPO/statuses/$HEAD_SHA" --silent \
            -f state=success \
            -f context=license/cla \
            -f description="$pass_description" \
            -f target_url="$RUN_URL"
          echo "Marked license/cla as passing for $HEAD_SHA."
